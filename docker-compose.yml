services:
  mongodb:
    image: mongo:latest
    container_name: momentgrid-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped
    # If you want to use authentication later, you can uncomment these:
    # environment:
    #   MONGO_INITDB_ROOT_USERNAME: root
    #   MONGO_INITDB_ROOT_PASSWORD: examplepassword

volumes:
  mongodb_data:
